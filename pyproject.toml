[project]
name = "clic-justo"
version = "0.1.0"
description = "Plataforma de Datos con Arquitectura Lambda para Deteccion de Fraude y Analitica Publicitaria"
readme = "README.md"
authors = [
    { name = "asterKnt" }
]
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: marcas para pruebas de humo criticas (smoke tests)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true