name: CI Suite Clic Justo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Configurar Python
        run: uv python install 3.14

      - name: Instalar dependencias del proyecto
        run: uv sync --frozen --dev

      - name: Ejecutar suite completa de pytest con cobertura
        run: uv run pytest --cov=src --cov-report=term-missing -v